[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vanguard"
version = "1.0.0"
description = "Vanguard — F&O dealer-positioning terminal (EOD compiler + realtime layer)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["vanguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
